<!DOCTYPE html>
<html>
<head>
<title>Student Text Editor</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
}

textarea {
    width: 60%;
    height: 250px;
    padding: 10px;
    font-size: 18px;
}

button {
    padding: 8px 12px;
    margin: 5px;
}
</style>
</head>

<body>

<h2>Simple Text Editor</h2>

<textarea id="editor"></textarea>

<br><br>

<button onclick="toUpper()">UPPERCASE</button>
<button onclick="toLower()">lowercase</button>
<button onclick="clearText()">Clear</button>

<button onclick="increase()">A+</button>
<button onclick="decrease()">A-</button>

<button onclick="textBlue()">Blue Text</button>
<button onclick="textRed()">Red Text</button>

<button onclick="bgYellow()">Yellow BG</button>
<button onclick="bgWhite()">White BG</button>

<button onclick="leftAlign()">Left</button>
<button onclick="centerAlign()">Center</button>
<button onclick="rightAlign()">Right</button>

<script>

let editor = document.getElementById("editor");

let size = 18;

function toUpper() {
    editor.value = editor.value.toUpperCase();
}

function toLower() {
    editor.value = editor.value.toLowerCase();
}

function clearText() {
    editor.value = "";
}

function increase() {
    size = size + 2;
    editor.style.fontSize = size + "px";
}

function decrease() {
    size = size - 2;
    editor.style.fontSize = size + "px";
}

function textBlue() {
    editor.style.color = "blue";
}

function textRed() {
    editor.style.color = "red";
}

function bgYellow() {
    editor.style.backgroundColor = "yellow";
}

function bgWhite() {
    editor.style.backgroundColor = "white";
}

function leftAlign() {
    editor.style.textAlign = "left";
}

function centerAlign() {
    editor.style.textAlign = "center";
}

function rightAlign() {
    editor.style.textAlign = "right";
}

</script>

</body>
</html>
